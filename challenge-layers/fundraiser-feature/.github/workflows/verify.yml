# Solana Summer grader — Assignment 04, Fundraiser.
#
# SEALED. The submission checker compares this file's blob SHA against the
# upstream copy. Editing it fails your submission before anything is read.
#
# It runs in YOUR fork, on YOUR free Actions minutes. Nothing here uploads
# your source anywhere, and the site never executes it — it only reads the
# result this job publishes.
#
# This assignment is open-ended, so there is no canonical suite. grade.py
# checks four things instead: it builds, your tests are green and there are
# more of them, the IDL gained surface, and you declared an error.

name: verify

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Not cancel-in-progress: a run that is already
# going may be the one somebody is about to submit, and cancelling it makes
# that commit ungradeable until they dispatch it again by hand.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Grade forks, not the starter.
    #
    # The starter has no feature, by definition, so grading it would park a
    # permanent red X on the repository every student clones — which reads as
    # "the starter is broken" and generates support questions that have
    # nothing to do with anybody's code. Dispatch it by hand from the Actions
    # tab when you want to smoke-test the grader against the upstream.
    if: github.event.repository.fork || github.event_name == 'workflow_dispatch'

    env:
      CHALLENGE_ID: fundraiser-feature
      PROGRAM_SO: target/deploy/fundraiser.so

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # `anchor test` starts a validator and deploys to it, which needs a
      # keypair. Runners have none.
      - name: Create a throwaway keypair
        run: solana-keygen new --no-bip39-passphrase -s -o "$HOME/.config/solana/id.json"

      # `cargo install avm` compiles avm from source — three to five minutes
      # to build a version manager whose only job here is to fetch one binary
      # we can fetch ourselves. Anchor has published prebuilt CLI binaries
      # since 0.31, so take the binary directly.
      #
      # The checksum is pinned. On any failure — moved asset, re-cut release,
      # unexpected bytes — it falls back to the slow path rather than failing
      # the run, because a sealed workflow that breaks for a whole cohort when
      # an upstream URL changes is worse than a slow one.
      - name: Install Anchor 1.1.2
        env:
          ANCHOR_URL: https://github.com/solana-foundation/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu
          ANCHOR_SHA256: fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ok=0
          if curl -sSfL --retry 3 -o /tmp/anchor "$ANCHOR_URL"; then
            if echo "$ANCHOR_SHA256  /tmp/anchor" | sha256sum -c - ; then
              install -m 0755 /tmp/anchor "$HOME/.local/bin/anchor"
              ok=1
            else
              echo "::warning::Anchor binary checksum did not match, building from source."
            fi
          else
            echo "::warning::Could not download the Anchor binary, building from source."
          fi
          if [ "$ok" = "0" ]; then
            cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
            avm install 1.1.2
            avm use 1.1.2
          fi

      # cargo-build-sbf downloads the Solana platform-tools toolchain on its
      # first run — a few hundred megabytes that are identical on every run.
      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ runner.os }}

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile || yarn install

      # grade.py owns `anchor keys sync`, `anchor build` and `anchor test`, so
      # a build failure still produces a result.json that says so rather than
      # a red run with nothing in it.
      - name: Grade
        run: python3 grader/grade.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-summer-result
          path: result.json
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          if [ -f result.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("result.json"))
          c = r["canonical"]
          print("## Solana Summer — " + r["challenge"])
          print()
          print(f"**Gates met:** {c['passed']}/{c['total']}")
          print()
          if r["notes"]:
              print("### Notes")
              for n in r["notes"]:
                  print(f"- {n}")
          PY
          fi
